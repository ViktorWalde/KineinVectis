# Configuração do cargo-deny — auditoria de licenças e dependências.
#
# **Obrigatório no gate desde 2026-08-30** (`scripts/verificar-deny.sh`, dentro
# do `verificar.sh`). Até essa data este arquivo existia e ninguém o executava:
# a única política de licença do projeto era uma regra que não rodava — a mesma
# forma da regra de split antes da catraca e do shellcheck antes desta semana.

[licenses]
# Só licenças permissivas. O objetivo declarado do projeto é ser 100% open
# source E redistribuível sem obrigação viral; por isso nada de copyleft aqui,
# nem mesmo LGPL. Ferramenta externa com licença copyleft (o GDB é GPL-3) é
# EXECUTADA como processo, nunca linkada — e por isso não aparece nesta lista.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # ISC: permissiva, equivalente funcional da BSD-2-Clause; OSI-approved e
    # FSF Free. Entrou em 2026-08-30 por `inotify`/`inotify-sys`, que chegam
    # pelo `notify` — o watcher adotado no ADR-0001.
    "ISC",
    # CC0-1.0: renúncia a direitos (domínio público). FSF Free. Entrou em
    # 2026-08-30 pelo `notify`. Aceita porque não impõe obrigação nenhuma a
    # jusante, que é o critério desta lista.
    "CC0-1.0",
    # BSD-3-Clause: permissiva, OSI-approved e FSF Free — a mesma família da
    # ISC já aceita acima, com uma cláusula a mais (não usar o nome dos autores
    # para endossar). Não impõe obrigação a jusante, que é o critério desta
    # lista. DECISÃO DO AUTOR em 2026-09-04, ao escolher que a IDE fale TLS:
    # ela chega pelo `subtle` (criptografia de tempo constante), na pilha do
    # `rustls`.
    "BSD-3-Clause",
    # CDLA-Permissive-2.0: licença de DADOS, não de código. Entra pelo
    # `webpki-roots`, que não é software — é a lista de certificados raiz do
    # programa da Mozilla, empacotada como crate. Permissiva e sem obrigação a
    # jusante. Mesma decisão do autor em 2026-09-04, pelo mesmo motivo: sem
    # raízes confiáveis não há verificação de certificado, e sem isso o TLS
    # seria teatro.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dependência de PATH dentro do próprio workspace (`kinein-protocol`,
# `kinein-config`) não é "wildcard" no sentido que este lint persegue: ela não
# resolve nada do registry, é o próprio repositório. Sem isto o gate reprova a
# estrutura de workspace que a ARCHITECTURE §3 define.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
