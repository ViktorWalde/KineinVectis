<text x="182" y="1755" class="body">Tudo que é pesado vira Job: scan, configure, build, index, flash, deploy, AI context.</text>
<text x="182" y="1795" class="small">UI nunca assume sucesso. UI espera evento do Core.</text>
<rect x="1290" y="1215" width="1260" height="650" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="1324" y="1273" class="h1">IPC + Events</text>
<rect x="1338" y="1325" width="1164" height="92" rx="18" fill="#0D1014" stroke="#5C8DFF" stroke-width="2"/>
<text x="1366" y="1361" class="h2">Request</text>
<text x="1540" y="1361" class="code2">{&quot;method&quot;:&quot;cmake.configure&quot;,&quot;params&quot;:{&quot;preset&quot;:&quot;debug&quot;}}</text>
<rect x="1338" y="1447" width="1164" height="92" rx="18" fill="#0D1014" stroke="#7CCF6A" stroke-width="2"/>
<text x="1366" y="1483" class="h2">Response</text>
<text x="1540" y="1483" class="code2">{&quot;result&quot;:{&quot;job_id&quot;:&quot;job_123&quot;}}</text>
<rect x="1338" y="1569" width="1164" height="92" rx="18" fill="#0D1014" stroke="#FFB000" stroke-width="2"/>
<text x="1366" y="1605" class="h2">Event</text>
<text x="1540" y="1605" class="code2">{&quot;event&quot;:&quot;build.finished&quot;,&quot;status&quot;:&quot;failed&quot;}</text>
<rect x="1338" y="1691" width="1164" height="92" rx="18" fill="#0D1014" stroke="#D45F5F" stroke-width="2"/>
<text x="1366" y="1727" class="h2">Error</text>
<text x="1540" y="1727" class="code2">{&quot;code&quot;:&quot;TOOLCHAIN_NOT_FOUND&quot;,&quot;can_repair&quot;:true}</text>
<rect x="2598" y="1215" width="1200" height="650" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="2632" y="1273" class="h1">Non-invasive rules</text>
<circle cx="2653" cy="1327" r="8" fill="#FFB000"/>
<text x="2676" y="1335" class="h2">No surprise automation</text>
<text x="3018" y="1335" class="small">não rodar ação pesada sem pedido</text>
<circle cx="2653" cy="1403" r="8" fill="#FFB000"/>
<text x="2676" y="1411" class="h2">No modal spam</text>
<text x="3018" y="1411" class="small">eventos atualizam status/painéis</text>
<circle cx="2653" cy="1479" r="8" fill="#FFB000"/>
<text x="2676" y="1487" class="h2">Risk Engine</text>
<text x="3018" y="1487" class="small">high exige confirmação</text>
<circle cx="2653" cy="1555" r="8" fill="#FFB000"/>
<text x="2676" y="1563" class="h2">AI is external</text>
<text x="3018" y="1563" class="small">AI Terminal só por intenção explícita</text>
<circle cx="2653" cy="1631" r="8" fill="#FFB000"/>
<text x="2676" y="1639" class="h2">Preview first</text>
<text x="3018" y="1639" class="small">setup, diff e contexto são revisáveis</text>
<circle cx="2653" cy="1707" r="8" fill="#FFB000"/>
<text x="2676" y="1715" class="h2">User remains in control</text>
<text x="3018" y="1715" class="small">sugestões são discretas</text>
<rect x="122" y="1900" width="3596" height="44" rx="16" fill="#0D1014" stroke="#2A2F37"/>
<text x="152" y="1929" class="small">Storage: ~/.config/kinein for user settings · ~/.cache/kinein for logs/cache · .kinein/ for workspace state · no public plugin system in MVP</text>
