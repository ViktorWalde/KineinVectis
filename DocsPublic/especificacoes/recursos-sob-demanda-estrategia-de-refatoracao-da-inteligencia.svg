<text x="218" y="965" class="h2">UI Layer</text>
<text x="592" y="965" class="small">visual discreto e contextual</text>
<rect x="192" y="1008" width="1220" height="54" rx="16" fill="#0D1014" stroke="#7CCF6A" stroke-width="2"/>
<text x="218" y="1043" class="h2">Refactoring Layer</text>
<text x="592" y="1043" class="small">preview, diff, apply, rollback</text>
<rect x="192" y="1086" width="1220" height="54" rx="16" fill="#0D1014" stroke="#D45F5F" stroke-width="2"/>
<text x="218" y="1121" class="h2">Inspection Layer</text>
<text x="592" y="1121" class="small">diagnósticos, severidade, ações</text>
