<text x="142" y="164" class="h1" fill="url(#kvgrad)">KV</text>
<text x="250" y="135" class="title">Parte 10.1 — Resource-on-Demand, Inspections e Refatoração</text>
<text x="253" y="184" class="subtitle">Sem hard cap de RAM: poder sob demanda, feedback em tempo real e contexto profundo de projeto</text>
<rect x="2140" y="112" width="166" height="48" rx="24" fill="#0E1217" stroke="#D45F5F" stroke-width="2"/>
<circle cx="2166" cy="136" r="7" fill="#D45F5F"/>
<text x="2184" y="144" class="pill">No hard cap</text>
<rect x="2322" y="112" width="274" height="48" rx="24" fill="#0E1217" stroke="#5C8DFF" stroke-width="2"/>
<circle cx="2348" cy="136" r="7" fill="#5C8DFF"/>
<text x="2366" y="144" class="pill">Full LSP when needed</text>
<rect x="2612" y="112" width="166" height="48" rx="24" fill="#0E1217" stroke="#FFB000" stroke-width="2"/>
<circle cx="2638" cy="136" r="7" fill="#FFB000"/>
