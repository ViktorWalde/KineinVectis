<circle cx="2820" cy="136" r="7" fill="#8A5CFF"/>
<text x="2838" y="144" class="pill">Deep context</text>
<rect x="2988" y="112" width="226" height="48" rx="24" fill="#0E1217" stroke="#7CCF6A" stroke-width="2"/>
<circle cx="3014" cy="136" r="7" fill="#7CCF6A"/>
