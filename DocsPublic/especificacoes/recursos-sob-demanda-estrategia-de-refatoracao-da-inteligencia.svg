<rect x="80" y="300" width="3680" height="1660" rx="28" fill="#111418" stroke="#2A2F37" filter="url(#shadow)"/>
<text x="122" y="362" class="h1">Kinein não limita poder. Kinein evita desperdício.</text>
<rect x="122" y="410" width="1175" height="360" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="156" y="468" class="h1">Resource-on-Demand</text>
<circle cx="172" cy="522" r="7" fill="#7CCF6A"/>
<text x="194" y="530" class="body">ativar por contexto</text>
<circle cx="172" cy="578" r="7" fill="#7CCF6A"/>
<text x="194" y="586" class="body">suspender ocioso</text>
<circle cx="172" cy="634" r="7" fill="#7CCF6A"/>
<text x="194" y="642" class="body">cachear em disco</text>
<circle cx="172" cy="690" r="7" fill="#7CCF6A"/>
<text x="194" y="698" class="body">UI sempre responsiva</text>
<rect x="1347" y="410" width="1175" height="360" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="1381" y="468" class="h1">Full Intelligence</text>
<circle cx="1397" cy="522" r="7" fill="#5C8DFF"/>
<text x="1419" y="530" class="body">clangd quando necessário</text>
<circle cx="1397" cy="578" r="7" fill="#5C8DFF"/>
<text x="1419" y="586" class="body">rust-analyzer quando necessário</text>
<circle cx="1397" cy="634" r="7" fill="#5C8DFF"/>
<text x="1419" y="642" class="body">semântica profunda</text>
<circle cx="1397" cy="690" r="7" fill="#5C8DFF"/>
<text x="1419" y="698" class="body">refactor com preview</text>
<rect x="2572" y="410" width="1175" height="360" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="2606" y="468" class="h1">Non-invasive UX</text>
<circle cx="2622" cy="522" r="7" fill="#FFB000"/>
<text x="2644" y="530" class="body">erro no local certo</text>
<circle cx="2622" cy="578" r="7" fill="#FFB000"/>
<text x="2644" y="586" class="body">Problems/Status Bar</text>
<circle cx="2622" cy="634" r="7" fill="#FFB000"/>
<text x="2644" y="642" class="body">ações contextuais</text>
<circle cx="2622" cy="690" r="7" fill="#FFB000"/>
<text x="2644" y="698" class="body">sem modal agressivo</text>
