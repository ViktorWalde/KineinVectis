<text x="1086" y="1757" class="h2">2 IDE-assisted</text>
<text x="1086" y="1789" class="small">move file + update CMake/Cargo</text>
<rect x="1956" y="1715" width="850" height="100" rx="22" fill="#0D1014" stroke="#FFB000" stroke-width="2"/>
<text x="1986" y="1757" class="h2">3 Build-aware</text>
<text x="1986" y="1789" class="small">extract library, update targets/presets</text>
<rect x="2856" y="1715" width="850" height="100" rx="22" fill="#0D1014" stroke="#8A5CFF" stroke-width="2"/>
<text x="2886" y="1757" class="h2">4 Workspace-aware</text>
<text x="2886" y="1789" class="small">multi-target, dependencies, validation</text>
<rect x="122" y="1922" width="3596" height="44" rx="16" fill="#0D1014" stroke="#2A2F37"/>
<text x="152" y="1951" class="small">Frase-guia: a Kinein não deve ser leve porque faz pouco; deve ser leve porque só faz o necessário e poderosa quando o usuário precisa.</text>
