<text x="1999" y="928" class="h1">MVP final recomendado</text>
<text x="2000" y="990" class="label">CORE</text>
<text x="2160" y="990" class="body">Rust Core + JSON-RPC + Jobs + Events</text>
<text x="2000" y="1042" class="label">PROJECTS</text>
<text x="2160" y="1042" class="body">CMake/Cargo detection + Toolchain scan</text>
<text x="2000" y="1094" class="label">EDITOR</text>
<text x="2160" y="1094" class="body">Tree-sitter + LSP status + diagnostics básicos</text>
<text x="2000" y="1146" class="label">BUILD</text>
<text x="2160" y="1146" class="body">CMake configure/build + Cargo check/build</text>
<text x="2000" y="1198" class="label">UX</text>
<text x="2160" y="1198" class="body">Wizard + Settings + Project Health</text>
<text x="2000" y="1250" class="label">ACTIONS</text>
<text x="2160" y="1250" class="body">Configuration Actions MVP com preview</text>
<text x="2000" y="1302" class="label">TERMINAL</text>
<text x="2160" y="1302" class="body">normal + AI Terminal externo</text>
<rect x="122" y="1430" width="1810" height="470" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="156" y="1488" class="h1">Pontuações para polimento futuro</text>
<circle cx="170" cy="1542" r="8" fill="#FFB000"/>
