<text x="410" y="1550" class="body">densidade, hierarquia, estados vazios, Command Palette</text>
<circle cx="170" cy="1610" r="8" fill="#FFB000"/>
<text x="195" y="1618" class="h2">Texto</text>
<text x="410" y="1618" class="body">nomes, descrições, erros, tooltips, docs curtas</text>
<circle cx="170" cy="1678" r="8" fill="#FFB000"/>
<text x="195" y="1686" class="h2">Técnico</text>
<text x="410" y="1686" class="body">parser CMake, TOML, diffs, rollback, logs</text>
<circle cx="170" cy="1746" r="8" fill="#FFB000"/>
