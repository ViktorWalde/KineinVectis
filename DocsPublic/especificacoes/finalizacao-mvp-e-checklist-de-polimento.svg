<circle cx="1397" cy="736" r="7" fill="#7CCF6A"/>
<text x="1419" y="744" class="body">status sem modal</text>
<rect x="2572" y="410" width="1175" height="420" rx="26" fill="#171B21" stroke="#2A2F37"/>
