  <rect class="elev stroke" x="1830" y="685" width="450" height="150" rx="14"/><text class="t small" x="1860" y="725">Principais símbolos</text><text class="t xs sec" x="1860" y="760">update(dt), PID::compute, setDuty...</text>
  <rect x="1830" y="865" width="450" height="145" rx="14" fill="#211B0B" stroke="#B97900"/><text class="t small" x="1860" y="905">Sugestão: validar dt</text><text class="t xs sec" x="1860" y="940">Evite valores não positivos antes do PID.</text><text class="t xs amber" x="2130" y="980">Aplicar sugestão</text>
