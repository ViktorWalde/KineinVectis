  <text class="t small sec" x="735" y="396">main.cpp</text>
  <rect x="880" y="370" width="250" height="44" rx="10" fill="#191E25" stroke="#2A2F37"/><line x1="895" y1="372" x2="1115" y2="372" stroke="#FFB000" stroke-width="4"/>
  <text class="t small amber" x="905" y="396">motor_control.cpp</text>
  <text class="t small sec" x="1160" y="396">CMakeLists.txt    +</text>
  <rect class="app stroke" x="706" y="414" width="1094" height="40"/>
  <text class="t small sec" x="735" y="440">src › drivers › motor › motor_control.cpp › MotorControl › update</text>
  <rect class="app stroke" x="706" y="454" width="76" height="838"/>
  <g class="t mono sec">
    <text x="800" y="505">#include "motor_control.hpp"</text>
    <text x="800" y="545">#include "motor_driver.hpp"</text>
    <text x="800" y="625">MotorControl::MotorControl(MotorDriver* driver)</text>
    <text x="800" y="665">    : driver(driver), pid(0.8f, 0.02f, 0.01f), state(State::IDLE) {}</text>
    <text x="800" y="745">bool MotorControl::init() {</text>
    <text x="800" y="785">    if (!driver-&gt;init()) {</text>
    <text x="800" y="825">        state = State::FAULT;</text>
    <text x="800" y="865">        return false;</text>
    <text x="800" y="945">void MotorControl::update(float dt) {</text>
    <rect x="782" y="967" width="910" height="34" fill="#1A1F26"/><text x="800" y="990">    if (state != State::RUNNING) return;</text>
    <text x="800" y="1030">    float current = driver-&gt;getCurrent();</text>
    <text x="800" y="1070">    float output = pid.compute(target, current, dt);</text>
    <text x="800" y="1110">    driver-&gt;setDuty(output);</text>
  </g>

