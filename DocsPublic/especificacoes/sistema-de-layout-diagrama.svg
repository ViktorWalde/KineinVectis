  <!-- Right notes -->
  <rect class="surface stroke" x="2880" y="210" width="840" height="500" rx="22"/>
  <text class="t h2 amber" x="2912" y="260">Layout real da IDE</text>
  <text class="t body" x="2912" y="320">• Sem callouts promocionais dentro do app.</text>
  <text class="t body" x="2912" y="370">• Editor é a área dominante.</text>
  <text class="t body" x="2912" y="420">• Target, CMake, Build e Debug visíveis.</text>
  <text class="t body" x="2912" y="470">• Painéis previsíveis: esquerda, direita, inferior.</text>
  <text class="t body" x="2912" y="520">• KV Context ajuda sem interromper.</text>
  <text class="t body" x="2912" y="570">• Âmbar como sinal de ação/estado.</text>

  <rect class="surface stroke" x="2880" y="760" width="840" height="490" rx="22"/>
  <text class="t h2 amber" x="2912" y="810">Marketing fica separado</text>
  <text class="t body sec" x="2912" y="870">Permitido em README/site, não dentro da UI real:</text>
  <text class="t body" x="2912" y="930">• slogans e cards de destaque</text>
  <text class="t body" x="2912" y="980">• setas/callouts explicativos</text>
  <text class="t body" x="2912" y="1030">• app icon grande</text>
  <text class="t body" x="2912" y="1080">• mockup com textos laterais</text>
  <text class="t small warn" x="2912" y="1160">Marketing explica o produto; a IDE executa o trabalho.</text>

  <rect class="surface stroke" x="2880" y="1300" width="840" height="470" rx="22"/>
  <text class="t h2 amber" x="2912" y="1350">Layouts operacionais</text>
  <text class="t body" x="2912" y="1410">Default Coding — Project + Editor + KV Context</text>
  <text class="t body" x="2912" y="1465">Focus Editor — painéis colapsados</text>
  <text class="t body" x="2912" y="1520">Build &amp; CMake — configuração em destaque</text>
  <text class="t body" x="2912" y="1575">Debug Active — stack, variables, linha atual</text>
  <text class="t body" x="2912" y="1630">Embedded Target — flash, serial, debug remoto</text>
  <text class="t body" x="2912" y="1685">Simulation Workbench — futuro, separado</text>

  <rect x="2880" y="1820" width="840" height="250" rx="22" fill="#151007" stroke="#B97900" stroke-width="2"/>
  <text class="t h2 amber" x="2912" y="1870">Para IA CLI</text>
  <text class="t body" x="2912" y="1930">• .md é fonte de verdade.</text>
  <text class="t body" x="2912" y="1980">• Imagem é mapa visual.</text>
  <text class="t body" x="2912" y="2030">• Implementar por componentes/regiões.</text>
