; Estilo do qmlformat para o QML deste repositorio (decisao do autor,
; 2026-10-08; DocsPublic/roadmaps/59 §2.4, 7b.4). O repositorio NAO e'
; formatado em massa: formatar tudo mudaria 479 de 543 arquivos e deixaria
; 18 acima do limite da catraca de arquitetura so' por formatacao. Este
; arquivo deixa explicito o que a IDE usa quando alguem formata um arquivo
; daqui, e e' o padrao do qmlformat 6.12 com quebra de linha unix.
[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=4
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=always
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
