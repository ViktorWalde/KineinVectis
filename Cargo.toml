[workspace]
resolver = "2"
members = [
    "crates/kinein-core",
    "crates/kinein-protocol",
    "crates/kinein-config",
    "crates/kinein-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kinein/kinein-vectis"
homepage = "https://github.com/kinein/kinein-vectis"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
kinein-protocol = { path = "crates/kinein-protocol" }
kinein-config = { path = "crates/kinein-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SQLite vendorizado (feature bundled): sem dep de sistema, reprodutível.
# Rede de segurança de dados (docs/23). FFI C fica na dependência.
rusqlite = { version = "0.32", features = ["bundled"] }
# Terminal profissional (docs/24 D2): PTY real (wezterm) + emulador VT
# (grid com cores/cursor/scrollback) para render fiel, resize e TUIs.
portable-pty = "0.8"
vt100 = "0.16"
# `vt100` usa `vte` internamente, mas não expõe DECSCUSR. O core observa essa
# única parte do estado VT com o mesmo parser maduro, sem parser ANSI próprio.
vte = "0.15"
# External file changes: mature cross-platform watcher (inotify on Linux)
# with a polling fallback selected by the core when the native backend fails.
notify = "=8.2.0"
# D3 syntax layer (docs/25): mature incremental parser plus the official
# C/C++/Rust grammars. Exact pins are audited in the component registry.
tree-sitter = "=0.26.11"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.24.2"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = { level = "deny", priority = -2 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# portable-pty/vt100 (terminal profissional, docs/24 D2) trazem bitflags 1.x
# por transitividade enquanto o resto usa 2.x — fora do nosso controle.
multiple_crate_versions = "allow"

[profile.dev]
debug = true
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
