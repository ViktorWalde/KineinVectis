[workspace]
resolver = "2"
members = [
    "crates/kinein-core",
    "crates/kinein-protocol",
    "crates/kinein-config",
    "crates/kinein-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kinein/kinein-vectis"
homepage = "https://github.com/kinein/kinein-vectis"
readme = "README.md"
rust-version = "1.85"
# Nenhum crate deste workspace vai para o crates.io: eles sao internos da IDE.
# Alem de ser a verdade, isto e' o que permite `allow-wildcard-paths` no
# deny.toml — o cargo-deny so aceita dependencia de path em crate NAO publicado,
# porque o crates.io recusaria uma.
publish = false

[workspace.dependencies]
kinein-protocol = { path = "crates/kinein-protocol" }
kinein-config = { path = "crates/kinein-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SQLite vendorizado (feature bundled): sem dep de sistema, reprodutível.
# Rede de segurança de dados (DocsPublic/23). FFI C fica na dependência.
rusqlite = { version = "0.32", features = ["bundled"] }
# Terminal profissional (DocsPublic/24 D2): PTY real (wezterm) para a sessão. O
# emulador VT vive no `alacritty_terminal`, declarado pelo core (ADR-0004): a
# Kinein anuncia `xterm-256color` ao processo, então precisa entregar um VT de
# verdade — tela alternada, mouse, reflow, wide chars e DECSCUSR inclusos.
portable-pty = "0.9"
# External file changes: mature cross-platform watcher (inotify on Linux)
# with a polling fallback selected by the core when the native backend fails.
notify = "=8.2.0"
# D3 syntax layer (DocsPublic/25): mature incremental parser plus the official
# C/C++/Rust grammars. Exact pins are audited in the component registry.
tree-sitter = "=0.26.11"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
# Cliente PostgreSQL SINCRONO (dominio `datasource`, DocsPublic/integracoes/37 §5.1).
# Auditado em 2026-09-04: MIT OR Apache-2.0, +52 crates, `cargo deny` verde sem
# acrescentar licenca a lista — o `sqlx` reprovaria, por trazer `foldhash`
# (Zlib). Mesmos mantenedores do `tokio-postgres`; embute um tokio proprio como
# detalhe de implementacao, e o codigo deste repositorio segue sincrono.
# Sem TLS de proposito: conexao cifrada e' decisao de outra fatia.
postgres = "0.19"
# Cliente HTTP SINCRONO do dominio `grafana` (DocsPublic/integracoes/37 §2). Medido
# em 2026-09-04: MIT OR Apache-2.0, e SEM as features padrao sao +5 crates
# novas (http, httparse, ureq, ureq-proto, utf8-zero), todas MIT OR Apache-2.0.
# Comparacao que decidiu: `ureq` com TLS custaria +19 e traria `subtle`
# (BSD-3-Clause) e `webpki-roots` (CDLA-Permissive-2.0), duas licencas FORA da
# allowlist; `reqwest` com blocking+json custaria +44.
#
# Sem TLS pelo mesmo motivo ja' registrado no `postgres` acima: cifrar e'
# decisao de outra fatia, e ela ficou pendente do autor por trazer licenca
# nova. Grafana local responde em `http://localhost:3000`, e um perfil `https`
# recebe recusa EXPLICITA, nunca um erro de rede confuso.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# SHA-256 do provedor de instalacao de toolchain (DocsPublic/integracoes/39 §5):
# o tarball baixado e' conferido contra o checksum PUBLICADO pela fonte ANTES
# de desempacotar. Medido em 2026-09-13: ja' estava no Cargo.lock (0.11.0) como
# transitiva do `mongodb` e do `postgres-protocol`; +0 crates. MIT OR Apache-2.0.
sha2 = "0.11"
# `access(2)` seguro para o dominio `serial` (DocsPublic/integracoes/38 §6, E1): a
# IDE precisa saber se o usuario le/escreve `/dev/ttyUSB0` SEM ABRIR a porta —
# abrir aciona DTR/RTS na maioria das pontes e isso RESETA a placa. `access`
# honra ACL, que e' como `TAG+="uaccess"` da' acesso sem grupo nenhum; `stat`
# sozinho mentiria nesse caso. Medido em 2026-09-11: ja' estava no Cargo.lock
# (1.1.4) como transitiva do `portable-pty`/`polling`; +0 crates. Apache-2.0
# WITH LLVM-exception OR Apache-2.0 OR MIT. Sem `unsafe` deste lado.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# Cliente MongoDB SINCRONO (dominio `datasource`, motor `mongo`). Auditado em
# 2026-09-04: Apache-2.0, +104 crates com as features padrao. Ele traz a pilha
# de TLS do `rustls`, e com ela duas licencas que NAO estavam na allowlist:
# `subtle` (BSD-3-Clause) e `webpki-roots` (CDLA-Permissive-2.0). As duas
# entraram no `deny.toml` por DECISAO DO AUTOR em 2026-09-04 — e a mesma
# decisao ligou o TLS do `ureq` acima.
#
# A feature `sync` da' a API bloqueante; o codigo deste repositorio segue
# sincrono, como no `postgres`.
mongodb = { version = "3.9", features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = { level = "deny", priority = -2 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# portable-pty/alacritty_terminal (terminal profissional, DocsPublic/24 D2) trazem
# bitflags 1.x por transitividade enquanto o resto usa 2.x — fora do nosso
# controle.
multiple_crate_versions = "allow"

[profile.dev]
debug = true
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
