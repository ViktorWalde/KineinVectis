<svg xmlns="http://www.w3.org/2000/svg"
    width="64" height="64" viewBox="0 0 64 64"
    role="img" aria-label="Kinein Vectis — Arquivo Python — REPL Prompt">
  <title>Kinein Vectis — Arquivo Python — REPL Prompt</title>

      <!-- document body -->
      <path d="M14 6H39L51 18V56H14C11.8 56 10 54.2 10 52V10C10 7.8 11.8 6 14 6Z"
            fill="#20242B"/>
      <path d="M14 8H37V21H49V52C49 53.1 48.1 54 47 54H14C12.9 54 12 53.1 12 52V10C12 8.9 12.9 8 14 8Z"
            fill="#343A44"/>
      <!-- folded amber corner -->
      <path d="M39 6L51 18H39Z" fill="#C98D19"/>
      <path d="M40.5 8.5L48.5 16.5H40.5Z" fill="#FFC93D"/>
      <path d="M39 18H51L39 6Z" fill="none" stroke="#8A5A0A" stroke-width="1.5"/>
      <!-- subtle Kinein bottom cut -->
      <path d="M42 54H47C48.1 54 49 53.1 49 52V47L42 54Z"
            fill="#59606B"/>
      <!-- emblem field -->
      <circle cx="30.5" cy="34" r="16.5" fill="#20242B" opacity=".72"/>
      <circle cx="30.5" cy="34" r="15" fill="none" stroke="#4B8BBE" stroke-width="1.5" opacity=".45"/>

  <!-- the REPL prompt: three chevrons and the cursor block. Nao e' o logotipo
       do Python (marca registrada da PSF): e' o `>>>` que todo mundo digita. -->
  <path d="M20 27.5L25 32L20 36.5" fill="none" stroke="#4B8BBE" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26.5 27.5L31.5 32L26.5 36.5" fill="none" stroke="#4B8BBE" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 27.5L38 32L33 36.5" fill="none" stroke="#4B8BBE" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor -->
  <rect x="34" y="39.5" width="7" height="3" rx="1" fill="#FFD43B"/>
</svg>
