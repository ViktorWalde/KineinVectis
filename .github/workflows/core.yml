# CI do core em C++ (docs/engenharia/gates-e-medida-de-eficacia.md, secao "A CI").
#
# Roda os mesmos presets de core/CMakePresets.json que a maquina de quem
# desenvolve, sem conteiner: o runner do GitHub ja traz os compiladores.
# - Piso declarado (decisao de 2026-11-22): GCC 14 e Clang 20.
# - Mais novo do runner: GCC 15 e Clang 22, com o clang-tidy 22.
# O compilador do preset e' trocado na linha de comando; o resto do preset vale.
name: Core C++

# So o ramo da reescrita; cada push roda inteiro, sem cancelar o anterior,
# para todo commit ter veredito.
on:
  push:
    branches: [reescrita/core-cpp23]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    branches: [reescrita/core-cpp23]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

# O padrao do runner, sem "shell:", e' "bash -e {0}", sem pipefail (medido
# no log da rodada 45188723983).
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  core:
    name: ${{ matrix.preset }} / ${{ matrix.cxx }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # O piso: o configure recusa compilador abaixo dele.
          - { preset: dev, cxx: g++-14 }
          - { preset: dev, cxx: clang++-20 }
          # O mais novo do runner, em todos os perfis.
          - { preset: dev, cxx: g++-15 }
          - { preset: production, cxx: g++-15 }
          - { preset: asan-ubsan, cxx: g++-15 }
          - { preset: tsan, cxx: g++-15 }
          - { preset: debug-stl, cxx: g++-15 }
          - { preset: cxx26-probe, cxx: g++-15 }
          - { preset: lint, cxx: clang++-22, tidy: clang-tidy-22, pyclang: python3-clang-22 }
          - { preset: asan-ubsan, cxx: clang++-22 }
          - { preset: tsan, cxx: clang++-22 }
    # A matriz entra nos scripts por variavel de ambiente, e nunca colada no
    # texto do script com ${{ }}: assim o shellcheck le o script de verdade,
    # e um valor nunca vira codigo (guia de seguranca do GitHub Actions,
    # "intermediate environment variable").
    env:
      PRESET: ${{ matrix.preset }}
      CXX_COMPILER: ${{ matrix.cxx }}
      TIDY: ${{ matrix.tidy }}
      PYCLANG: ${{ matrix.pyclang }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem passo de vm.mmap_rnd_bits: a imagem ja grava 28 no sysctl.conf
      # (actions/runner-images, images/ubuntu/scripts/build/
      # configure-environment.sh, issue 9491).

      # Os bindings de Python da libclang, da versao do clang-tidy, para o
      # gate.duplication do lint (docs/engenharia/gates-e-medida-de-eficacia.md).
      - name: Install the libclang Python bindings
        if: ${{ matrix.pyclang }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "$PYCLANG"

      # Sem "| head": o shell roda com -o pipefail, e um head que fecha o
      # pipe cedo pode reprovar o passo pelo SIGPIPE de quem escreve.
      - name: Show the toolchain
        run: |
          "$CXX_COMPILER" --version
          cmake --version
          ninja --version
          if [ -n "$TIDY" ]; then "$TIDY" --version; fi

      - name: Configure
        working-directory: core
        run: |
          extra=()
          if [ -n "$TIDY" ]; then
            extra+=("-DKINEIN_CLANG_TIDY_EXE=$(command -v "$TIDY")")
          fi
          cmake --preset "$PRESET" -DCMAKE_CXX_COMPILER="$CXX_COMPILER" "${extra[@]}"

      - name: Build
        working-directory: core
        run: cmake --build --preset "$PRESET"

      - name: Test
        working-directory: core
        run: ctest --preset "$PRESET"
