# CI of the core of Kinein Vectis 0.1.
#
# Documented in: docs/engineering/gates-and-effectiveness.md, section "The CI"
#
# It is the only CI of the repository. It runs the same
# core/CMakePresets.json presets as a developer machine, with no container: the GitHub runner
# ships the compilers.
# - Declared floor, the maintainer's decision of 2026-11-22: GCC 14 and Clang 20.
# - Newest on the runner: GCC 15 and Clang 22, with clang-tidy 22.
# The preset's compiler is overridden on the command line; the rest of the
# preset applies.
name: Core 0.1

# The single branch, main. Every pull request into it and every push to it runs in full,
# with no path filter and without canceling the previous run: every commit gets a verdict.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The runner default without "shell:" is "bash -e {0}", without pipefail (log of GitHub Actions
# run 45188723983).
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  core:
    name: ${{ matrix.preset }} / ${{ matrix.cxx }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: configure rejects a compiler below it.
          - { preset: dev, cxx: g++-14 }
          - { preset: dev, cxx: clang++-20 }
          # The newest on the runner, in every profile.
          - { preset: dev, cxx: g++-15 }
          - { preset: production, cxx: g++-15 }
          - { preset: asan-ubsan, cxx: g++-15 }
          - { preset: tsan, cxx: g++-15 }
          - { preset: debug-stl, cxx: g++-15 }
          - { preset: lint, cxx: clang++-22, tidy: clang-tidy-22, pyclang: python3-clang-22 }
          - { preset: asan-ubsan, cxx: clang++-22 }
          - { preset: tsan, cxx: clang++-22 }
    # The matrix reaches the scripts through environment variables, never pasted
    # into the script text with ${{ }}: this way shellcheck reads the real
    # script, and a value never becomes code (GitHub Actions security guide,
    # "intermediate environment variable").
    env:
      PRESET: ${{ matrix.preset }}
      CXX_COMPILER: ${{ matrix.cxx }}
      TIDY: ${{ matrix.tidy }}
      PYCLANG: ${{ matrix.pyclang }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No vm.mmap_rnd_bits step: the image writes vm.mmap_rnd_bits=28 to sysctl.conf
      # (actions/runner-images, images/ubuntu/scripts/build/configure-environment.sh and
      # issue 9491).

      # The libclang Python bindings, of the clang-tidy version, for the lint
      # gate.duplication (docs/engineering/gates-and-effectiveness.md).
      - name: Install the libclang Python bindings
        if: ${{ matrix.pyclang }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "$PYCLANG"

      # No "| head": the shell runs with -o pipefail, and a head that closes the
      # pipe early can fail the step through the writer's SIGPIPE.
      - name: Show the toolchain
        run: |
          "$CXX_COMPILER" --version
          cmake --version
          ninja --version
          if [ -n "$TIDY" ]; then "$TIDY" --version; fi

      - name: Configure
        working-directory: core
        run: |
          extra=()
          if [ -n "$TIDY" ]; then
            extra+=("-DKINEIN_CLANG_TIDY_EXE=$(command -v "$TIDY")")
          fi
          cmake --preset "$PRESET" -DCMAKE_CXX_COMPILER="$CXX_COMPILER" "${extra[@]}"

      - name: Build
        working-directory: core
        run: cmake --build --preset "$PRESET"

      - name: Test
        working-directory: core
        run: ctest --preset "$PRESET"
