nt-weight="600" text-anchor="start">target.list</text><rect x="165" y="1117" width="300" height="46" rx="18" fill="#1C1A12" stroke="#FFB000" stroke-width="2"/><text x="183" y="1149" fill="#FFB000" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">target.create</text><rect x="165" y="1189" width="300" height="46" rx="18" fill="#1C1A12" stroke="#FFB000" stroke-width="2"/><text x="183" y="1221" fill="#FFB000" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">target.select</text><rect x="165" y="1261" width="300" height="46" rx="18" fill="#1C1A12" stroke="#5C8DFF" stroke-width="2"/><text x="183" y="1293" fill="#5C8DFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">target.validate</text><rect x="165" y="1333" width="300" height="46" rx="18" fill="#1C1A12" stroke="#5C8DFF" stroke-width="2"/><text x="183" y="1365" fill="#5C8DFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">target.status</text><rect x="165" y="1405" width="300" height="46" rx="18" fill="#1C1A12" stroke="#5C8DFF" stroke-width="2"/><text x="183" y="1437" fill="#5C8DFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">target.update</text><text x="540" y="1088" fill="#A9A39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Target ativo aparece na toolbar</text><text x="540" y="1160" fill="#A9A39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Build/Run/Debug respeitam o target</text><text x="540" y="1232" fill="#A9A39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Estados claros: Ready, Missing, Running</text><text x="540" y="1304" fill="#A9A39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Nunca esconder comandos críticos</text><text x="540" y="1376" fill="#A9A39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Sempre permitir copiar comando</text><rect x="1360" y="900" width="1120" height="820" rx="26" fill="#111418" stroke="#2A2F37" stroke-width="2"/><text x="1405" y="960" fill="#E7E2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="start">Jobs e Logs</text><text x="1405" y="1005" fill="#A9A39A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start">Toda ação externa vira job cancelável</text><rect x="1405" y="1045" width="310" height="46" rx="18" fill="#1C1A12" stroke="#5C8DFF" stroke-width="2"/><text x="1423" y="1077" fill="#5C8DFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">Detect Tools</text><rect x="1405" y="1117" width="310" height="46" rx="18" fill="#1C1A12" stroke="#FFB000" stroke-width="2"/><text x="1423" y="1149" fill="#FFB000" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">Configure / Build</text><rect x="1405" y="1189" width="310" height="46" rx="18" fill="#1C1A12" stroke="#FFB000" stroke-width="2"/><text x="1423" y="1221" fill="#FFB000" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">Deploy / Flash</text><rect x="1405" y="1261" width="310" height="46" rx="18" fill="#1C1A12" stroke="#8A5CFF" stroke-width="2"/><text x="1423" y="1293" fill="#8A5CFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">Start QEMU</text><rect x="1405" y="1333" width="310" height="46" rx="18" fill="#1C1A12" stroke="#7CCF6A" stroke-width="2"/><text x="1423" y="1365" fill="#7CCF6A" font-family="Inter, Segoe UI, Arial, sans-serif" font-