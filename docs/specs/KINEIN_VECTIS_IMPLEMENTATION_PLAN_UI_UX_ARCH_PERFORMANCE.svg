<text x="156" y="1814" class="h1">Regras de corte se pesar</text>
<text x="156" y="1860" class="body">Cortar primeiro: simulação, QEMU visual, embedded avançado, docs cacheadas, plugin system, actions avançadas, animações e painéis secundários.</text>
<text x="2280" y="1860" class="body">Não cortar: performance, editor, build, toolchain, actions MVP, modo Expert, preview obrigatório e separação Core/UI.</text>
