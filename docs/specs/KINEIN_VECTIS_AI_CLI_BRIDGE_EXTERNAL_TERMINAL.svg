<text x="2521" y="1224" class="h2">AI Terminal</text>
<text x="2521" y="1258" class="small">abre CLI externa configurada pelo usuário</text>
<rect x="2493" y="1360" width="1189" height="460" rx="22" fill="#0D1014" stroke="#2A2F37"/>
<text x="2521" y="1408" class="h2">Settings / Profiles</text>
<text x="2523" y="1460" class="small">Profile</text>
<rect x="2702" y="1432" width="916" height="40" rx="10" fill="#171B21" stroke="#2C333D"/>
<text x="2725" y="1460" class="body" fill="#E7E2D8">Claude CLI / Codex CLI / Aider / custom</text>
<text x="2523" y="1520" class="small">Command</text>
<rect x="2702" y="1492" width="916" height="40" rx="10" fill="#171B21" stroke="#2C333D"/>
<text x="2725" y="1520" class="body" fill="#E7E2D8">claude, codex, aider, opencode...</text>
<text x="2523" y="1580" class="small">Context mode</text>
<rect x="2702" y="1552" width="916" height="40" rx="10" fill="#171B21" stroke="#2C333D"/>
