<text x="632" y="1424" class="small">Terminal</text>
<rect x="742" y="1398" width="145" height="38" rx="10" fill="#201A10" stroke="#FFB000"/>
<text x="766" y="1424" class="small" fill="#E7E2D8">AI Terminal</text>
<text x="624" y="1480" class="code" fill="#FFB000">external CLI: Claude CLI</text>
<text x="624" y="1525" class="code">context: build failure / active file / CMake summary</text>
<text x="624" y="1570" class="code2">Kinein prepared context only. The AI CLI is external and user-configured.</text>
<text x="624" y="1630" class="code" fill="#7CCF6A">$ claude --context /tmp/kinein/context/ctx_001.md</text>
<rect x="1620" y="526" width="782" height="854" fill="#12161B" stroke="#2A2F37"/>
<text x="1648" y="580" class="h2">AI CLI Bridge</text>
<rect x="1646" y="625" width="730" height="100" rx="18" fill="#0D1014" stroke="#FFB000" stroke-width="2"/>
<text x="1670" y="663" class="h2">1. Context Builder</text>
<text x="1670" y="697" class="small">build log + active file + toolchain</text>
<rect x="1646" y="747" width="730" height="100" rx="18" fill="#0D1014" stroke="#D45F5F" stroke-width="2"/>
<text x="1670" y="785" class="h2">2. Sanitizer</text>
<text x="1670" y="819" class="small">remove secrets and forbidden files</text>
<rect x="1646" y="869" width="730" height="100" rx="18" fill="#0D1014" stroke="#5C8DFF" stroke-width="2"/>
<text x="1670" y="907" class="h2">3. Preview</text>
<text x="1670" y="941" class="small">show context and command</text>
<rect x="1646" y="991" width="730" height="100" rx="18" fill="#0D1014" stroke="#7CCF6A" stroke-width="2"/>
<text x="1670" y="1029" class="h2">4. Launch</text>
<text x="1670" y="1063" class="small">open external AI terminal</text>
<rect x="2457" y="450" width="1261" height="1340" rx="26" fill="#171B21" stroke="#2A2F37"/>
<text x="2493" y="508" class="h1">Decisão de produto</text>
<text x="2493" y="550" class="body">IA é atalho externo, não painel/chat da IDE.</text>
<rect x="2493" y="600" width="1189" height="104" rx="20" fill="#0D1014" stroke="#5C8DFF" stroke-width="2"/>
<text x="2521" y="640" class="h2">Kinein Determinística</text>
<text x="2521" y="674" class="small">diagnóstico, logs, Project Health, CMake, Toolchain</text>
<line x1="3087.5" y1="704" x2="3087.5" y2="746" stroke="#FFB000" stroke-width="4" stroke-dasharray="8 8"/>
<rect x="2493" y="746" width="1189" height="104" rx="20" fill="#0D1014" stroke="#FFB000" stroke-width="2"/>
