<text x="2521" y="966" class="small">bloqueia secrets, .env, chaves, tokens</text>
<line x1="3087.5" y1="996" x2="3087.5" y2="1038" stroke="#FFB000" stroke-width="4" stroke-dasharray="8 8"/>
<rect x="2493" y="1038" width="1189" height="104" rx="20" fill="#0D1014" stroke="#8A5CFF" stroke-width="2"/>
