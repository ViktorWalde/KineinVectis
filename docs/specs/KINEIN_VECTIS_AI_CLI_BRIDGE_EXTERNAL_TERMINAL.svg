<text x="122" y="362" class="h1">Arquitetura correta: a IDE prepara contexto, a IA roda fora</text>
<text x="122" y="404" class="body">A Kinein não conversa por você. Ela organiza evidências e abre a ferramenta externa que você escolheu.</text>
