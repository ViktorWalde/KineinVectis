<text x="790" y="562" class="small" fill="#A9A39A">build.log</text>
<text x="622" y="635" class="code2" fill="#6F737A"> 1</text>
<text x="678" y="635" class="code" fill="#FFC93D">#include &lt;motor_driver.hpp&gt;</text>
<text x="622" y="681" class="code2" fill="#6F737A"> 2</text>
<text x="678" y="681" class="code" fill="#E7E2D8"></text>
<text x="622" y="727" class="code2" fill="#6F737A"> 3</text>
<text x="678" y="727" class="code" fill="#8A5CFF">int main() {</text>
<text x="622" y="773" class="code2" fill="#6F737A"> 4</text>
<text x="678" y="773" class="code" fill="#FFC93D">    MotorDriver driver;</text>
<text x="622" y="819" class="code2" fill="#6F737A"> 5</text>
<text x="678" y="819" class="code" fill="#FFC93D">    driver.init();</text>
<text x="622" y="865" class="code2" fill="#6F737A"> 6</text>
<text x="678" y="865" class="code" fill="#E7E2D8">    return 0;</text>
<text x="622" y="911" class="code2" fill="#6F737A"> 7</text>
<text x="678" y="911" class="code" fill="#E7E2D8">}</text>
