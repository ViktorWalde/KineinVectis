# A leitura do marcador do espelho veio com o INF-20 (roadmaps/40.7 §7.415),
# pelo mesmo guarda: com ela, cada chamada do `kinein_dir::read` tem a sua
# entrada.
[[entrada]]
id = "inf-15-dono-marcador-do-espelho-le-direto"
regra = "R-DADOS-01"
roda = "cargo test -p kinein-core --lib --all-features --locked the_marker_is_read_and_written_by_the_guard"
mensagem = [
    "test remote::mirror::tests::the_marker_is_read_and_written_by_the_guard ... FAILED",
    "assertion failed: read_marker(&linked).is_none()",
]
[[entrada.edicao]]
arquivo = "crates/kinein-core/src/remote/mirror.rs"
texto = '''crate::kinein_dir::read(root, MARKER)'''
troca = '''std::fs::read(root.join(".kinein").join(MARKER)).map(Some).or_else(|error| if error.kind() == std::io::ErrorKind::NotFound { Ok(None) } else { Err(error.to_string()) })'''
