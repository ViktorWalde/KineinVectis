# Os mutantes do INF-15 (roadmaps/40.7 §7.413): a leitura do `.kinein` pelo
# guarda, que não segue link, não espera num FIFO e lê até 1 MiB. Dez tiram
# uma conferência do `kinein_dir::read` e do que ele usa; os outros fazem
# cada dono voltar a ler direto, e o teste do arquivo dele tem de reprovar.
item = "INF-15"
compila = "cargo test -p kinein-core --lib --all-features --locked --no-run"
roda = "cargo test -p kinein-core --lib --all-features --locked kinein_dir"

[[entrada]]
id = "inf-15-guarda-abre-esperando"
regra = "R-DADOS-02"
mensagem = [
    "test kinein_dir::tests::a_fifo_is_refused_without_waiting_for_a_writer ... FAILED",
    "a leitura prendeu no FIFO",
]
[[entrada.edicao]]
arquivo = "crates/kinein-core/src/platform/unix.rs"
texto = "OFlags::RDONLY | OFlags::NOFOLLOW | OFlags::NONBLOCK | OFlags::CLOEXEC"
troca = "OFlags::RDONLY | OFlags::NOFOLLOW | OFlags::CLOEXEC"

