# Os mutantes que ficaram registrados como equivalentes (roadmaps/63 §0, D-21):
# cada um troca uma chamada do guarda pela leitura ou gravação direta logo
# depois de uma conferência do mesmo caminho, e nenhum teste do Rust o vê: o
# `roda` é o passo de testes do gate, com o workspace inteiro. Sobreviver é o
# esperado enquanto o dono (`pendente`) está aberto; quando ele fecha, a
# entrada vai para o catálogo dele e tem de reprovar. Nenhuma entrada entra
# aqui, e o arquivo é apagado quando a última sai.
item = "D-21"
compila = "cargo test --workspace --all-features --locked --no-run"
roda = "cargo test --workspace --all-features --no-fail-fast --locked"
prazo = 1800

